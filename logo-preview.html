<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizKnow Logo Preview</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .quiz-square {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: #1e40af;
            border-radius: 8px;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .know-square {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: #059669;
            border-radius: 8px;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .app-name {
            font-size: 32px;
            color: #374151;
            margin: 20px 0;
            letter-spacing: 1px;
        }

        .tagline {
            color: #6b7280;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">
            <span class="quiz-square">Q</span>
            <span class="know-square">K</span>
        </div>
        <div class="app-name">QUIZKNOW</div>
        <div class="tagline">Master Knowledge Through Interactive Quizzes</div>
    </div>
</body>
</html>
